<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Flying Game - One Command Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        #gameCanvas {
            border: 4px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 70%, #90EE90 100%);
            cursor: crosshair;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-weight: bold;
            z-index: 10;
        }
        
        .hud-item {
            margin-bottom: 10px;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 5px;
        }
        
        #instructions {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 10px;
            z-index: 10;
        }
        
        #instructions h3 {
            margin-bottom: 10px;
            color: #FFD700;
        }
        
        #instructions p {
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div class="hud-item">Altitude: <span id="altitude">0</span>m</div>
        <div class="hud-item">Speed: <span id="speed">0</span> m/s</div>
        <div class="hud-item">Battery: <span id="battery">100</span>%</div>
    </div>
    
    <div id="instructions">
        <h3>🎮 Controls</h3>
        <p>⬆️ W/↑ - Increase Thrust</p>
        <p>⬇️ S/↓ - Decrease Thrust</p>
        <p>⬅️ A/← - Move Left</p>
        <p>➡️ D/→ - Move Right</p>
        <p>🔄 R - Reset Position</p>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <script src="game.js"></script>
</body>
</html>
