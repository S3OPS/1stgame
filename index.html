<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Defense: AI Drone Assault</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle at 50% 15%, #2a3b6b 0%, #0b1024 45%, #05070f 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #e9f2ff;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(120, 180, 255, 0.2), transparent 45%),
                        radial-gradient(circle at 80% 10%, rgba(255, 160, 220, 0.15), transparent 40%),
                        radial-gradient(circle at 50% 80%, rgba(80, 140, 255, 0.12), transparent 50%);
            pointer-events: none;
        }
        
        #gameCanvas {
            border: 3px solid rgba(130, 200, 255, 0.4);
            box-shadow: 0 0 40px rgba(50, 120, 255, 0.35), 0 12px 30px rgba(0,0,0,0.6);
            background: radial-gradient(circle at top, #182747 0%, #0a0f1f 60%, #03060f 100%);
            cursor: none;
            border-radius: 10px;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 18px;
            text-shadow: 0 0 8px rgba(120,200,255,0.6);
            font-weight: bold;
            z-index: 10;
            background: rgba(8, 12, 24, 0.65);
            border: 1px solid rgba(120, 200, 255, 0.35);
            border-radius: 12px;
            padding: 10px 14px;
            box-shadow: 0 0 25px rgba(50, 120, 255, 0.25);
            backdrop-filter: blur(6px);
        }
        
        .hud-item {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 4px 2px;
        }
        
        #instructions {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #f4f7ff;
            text-shadow: 0 0 8px rgba(120,200,255,0.6);
            background: rgba(8, 12, 24, 0.65);
            padding: 15px 18px;
            border-radius: 12px;
            border: 1px solid rgba(120, 200, 255, 0.35);
            z-index: 10;
            box-shadow: 0 0 25px rgba(50, 120, 255, 0.25);
            backdrop-filter: blur(6px);
        }
        
        #instructions h3 {
            margin-bottom: 10px;
            color: #FFD700;
        }
        
        #instructions p {
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div class="hud-item">Score: <span id="score">0</span></div>
        <div class="hud-item">Base Integrity: <span id="integrity">100</span>%</div>
        <div class="hud-item">Wave: <span id="wave">1</span></div>
        <div class="hud-item">Active Drones: <span id="drones">0</span></div>
    </div>
    
    <div id="instructions">
        <h3>🎮 Controls</h3>
        <p>🖱️ Move Mouse - Aim Crosshair</p>
        <p>💥 Click/Hold - Fire Corner Lasers</p>
        <p>🔄 R - Restart Defense</p>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <script src="game.js"></script>
</body>
</html>
