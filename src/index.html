<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Laser Defense: AI Drone Assault - A rebuilt HTML5 canvas defense game">
    <title>Laser Defense: AI Drone Assault</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="hud">
        <div class="hud-item">Score: <span id="score">0</span></div>
        <div class="hud-item">Base Integrity: <span id="integrity">100</span>%</div>
        <div class="hud-item">Wave: <span id="wave">1</span></div>
        <div class="hud-item">Active Drones: <span id="drones">0</span></div>
    </div>
    
    <div id="instructions">
        <h3>🎮 Controls</h3>
        <p>🖱️ Move Mouse - Aim Crosshair</p>
        <p>💥 Click/Hold - Fire Corner Lasers</p>
        <p>🔄 R - Restart Defense</p>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <script type="module" src="game.js"></script>
</body>
</html>
